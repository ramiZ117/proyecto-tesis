<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>{{ titulo }}</title></head>
<body style="margin:0;padding:24px 12px;background:#F4F1EA;font-family:Arial,Helvetica,sans-serif;color:#1A1F1C">
  <p style="max-width:420px;margin:0 auto 12px;font-size:14px;line-height:1.5">{{ saludo }}</p>
  <table role="presentation" style="margin:0 auto;background:#ffffff;border:1px solid #DDD6C6;border-radius:6px" cellpadding="0" cellspacing="0">
    <tr><td style="padding:18px 16px">
      <pre style="margin:0;font-family:'Courier New',Consolas,monospace;font-size:13px;line-height:1.4;color:#111;white-space:pre">{{ ticket }}</pre>
    </td></tr>
  </table>
  {% if pie %}<p style="max-width:420px;margin:12px auto 0;font-size:12px;color:#6B6F69;text-align:center">{{ pie }}</p>{% endif %}
</body></html>
